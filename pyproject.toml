[project]
name = "deep-research"
version = "0.1.0"
description = "Unrestricted AI-powered research tool. Searches the entire web including dark web (.onion) and synthesizes findings using local uncensored LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Research Tool"}
]
keywords = ["research", "ai", "llm", "uncensored", "darkweb", "tor", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "ddgs>=9.0",
    "trafilatura>=2.0",
    "httpx>=0.27",
    "httpx-socks>=0.8",
    "stem>=1.8",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "pysocks>=1.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
ollama = []
performers = [
    "onnxruntime>=1.18",
    "opencv-python-headless>=4.9",
    "openpyxl>=3.1",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
]

[project.scripts]
research = "research.cli:app"

[project.urls]
Repository = "https://github.com/yourusername/deep-research"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.hatch.build.targets.wheel]
packages = ["research"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
